[package]
name = "evieverse-trust"
description = "Trust: the plugins that score a post, a comment or a profile, the policy that says where the score sends it, and the blocked words of the server and of its hashtags."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# The plugin a test configures (src/testing.rs), in place of the stub plugins tests once gave
# the API as JavaScript. Never part of a build that serves.
test-plugin = []

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1"
evieverse-core = { path = "../core" }
fancy-regex = "0.20.2"
futures = "0.3.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
# The engine blocked patterns run in: admins wrote them as JavaScript regular expressions, and
# this is a JavaScript engine's, which can be stopped when a pattern outruns its time (see
# src/patterns.rs).
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "io-util"] }
unicode-normalization = "0.1"
unicode-properties = "0.1"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
evieverse-core = { path = "../core", features = ["testing"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["net"] }
