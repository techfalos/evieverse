[package]
name = "evieverse-core"
description = "What the compactor and the trust plugins share: the configuration, the database, Redis, the object store and the formats stored in them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# What tests of this side make a database and a configuration with (src/testing.rs). Never
# part of a build that serves: it runs the API's migrations, which are the API's to run.
testing = []

[dependencies]
anyhow = "1.0.105"
base64 = "0.22.1"
brotli = "9.1.3"
ed25519-dalek = "2.2.0"
futures = "0.3.34"
hex = "0.4.3"
icu_properties = "2.4.0"
icu_segmenter = "2.4.0"
indexmap = "2.14.2"
# The services the API's own OpenDAL (the `opendal` npm package) is built with, so that a store
# the API reaches is one the compactor reaches too.
opendal = { version = "0.59.5", features = [
    "services-aliyun-drive",
    "services-alluxio",
    "services-azblob",
    "services-azdls",
    "services-azfile",
    "services-b2",
    "services-cos",
    "services-dropbox",
    "services-fs",
    "services-gcs",
    "services-gdrive",
    "services-hf",
    "services-http",
    "services-ipfs",
    "services-koofr",
    "services-obs",
    "services-onedrive",
    "services-oss",
    "services-s3",
    "services-seafile",
    "services-swift",
    "services-upyun",
    "services-vercel-artifacts",
    "services-webdav",
    "services-webhdfs",
    "services-yandex-disk",
] }
rand = "0.10.4"
redis = { version = "1.8.3", features = ["tokio-comp", "connection-manager", "script", "tokio-rustls-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
# The TLS of redis and reqwest above and of sqlx below, named here for the one thing none of
# them does: giving the process a provider (see hot.rs).
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "io-util", "process", "signal", "net"] }
unicode-normalization = "0.1"
unicode-properties = "0.1"
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4", "v7"] }

[dev-dependencies]
evieverse-core = { path = ".", features = ["testing"] }
tempfile = "3"
