# Local infrastructure for development and integration tests.
#   docker compose up -d postgres mysql redis
#   TEST_POSTGRES_URL=postgres://evieverse:evieverse@localhost:5432/evieverse \
#   TEST_MYSQL_URL=mysql://evieverse:evieverse@localhost:3306/evieverse \
#   TEST_REDIS_URL=redis://127.0.0.1:6379 npm test
# Or run the whole stack (Postgres, an S3-compatible store for content and summaries, Valkey for the feed
# index, a compactor):
#   docker compose --profile app up --build
#
# The services shared with the other compose files are defined in compose.base.yml.
x-app-env: &app-env
  PUBLIC_BASE_URL: http://localhost:3000
  COMPACT_IN_PROCESS: 'false'
  # Ads in hashtag feeds and at the end of posts, which admins keep at /monetization/ads. Off unless set to
  # true. The app and the compactor share them: the compactor publishes the ads the app shows.
  MONETIZATION_FEED_ADS: ${MONETIZATION_FEED_ADS:-false}
  MONETIZATION_POST_ADS: ${MONETIZATION_POST_ADS:-false}

services:
  postgres:
    extends: { file: compose.base.yml, service: postgres }
    ports: ['5432:5432']

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: evieverse
      MYSQL_PASSWORD: evieverse
      MYSQL_DATABASE: evieverse
    ports: ['3306:3306']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 2s
      retries: 60

  redis:
    extends: { file: compose.base.yml, service: redis }
    ports: ['6379:6379']

  s3:
    extends: { file: compose.base.yml, service: s3 }
    ports: ['9000:9000', '9001:9001']

  s3-init:
    extends: { file: compose.base.yml, service: s3-init }
    depends_on: [s3]

  app:
    profiles: [app]
    extends: { file: compose.base.yml, service: app-s3 }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    ports: ['3000:3000']
    environment: *app-env

  compactor:
    profiles: [app]
    extends: { file: compose.base.yml, service: compactor }
    depends_on: [app]
    environment: *app-env
