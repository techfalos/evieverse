# A whole server in one container, for building a frontend against or for running one: the API, the
# compactor and Valkey, built from this repo (the Dockerfile's `standalone` target), with no seed data
# and no testbed page. Everything it keeps is on one volume: the database (SQLite), the content and
# summaries, and Valkey's data. Content is on that volume, so /content/:id/raw streams bytes from the
# server itself rather than redirecting to an object store.
#
#   docker compose -f docker-compose.server.yml up -d --build
#   curl http://localhost:3000/health
#
# The first time it starts, the server creates its admin and writes the admin's profile for the CLI,
# API key included, to the volume: docker compose -f docker-compose.server.yml exec app cat /app/data/admin-profile.json
#
# To start over: docker compose -f docker-compose.server.yml down -v
name: evieverse-server

services:
  app:
    build:
      context: .
      target: standalone
    image: evieverse-standalone
    ports: ['${SERVER_PORT:-3000}:3000']
    # Time for the requests under way and the compactor's pass to end, and for Valkey to write what it holds.
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      retries: 30
    environment:
      # The database: SQLite, a file on the volume, unless these name a Postgres or a MySQL somewhere else
      # (DB_DIALECT=postgres with DATABASE_URL=postgres://user:password@host:5432/database).
      DB_DIALECT: ${DB_DIALECT:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-/app/data/evieverse.sqlite}
      # The feed index: the container's own Valkey, which keeps its data on the volume, unless this names a
      # Redis or a Valkey somewhere else. VALKEY_MAXMEMORY is the most the container's own may hold.
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379}
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-512mb}
      CONTENT_SCHEME: fs
      CONTENT_OPTIONS: '{"root":"/app/data/content"}'
      PUBLIC_BASE_URL: http://localhost:${SERVER_PORT:-3000}
      # Set to the frontend's origins, e.g. http://localhost:5173, to allow only those.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Docker Desktop gives every request from the host the same source IP, so the per-IP limits on
      # /register and on /feed are effectively global.
      REGISTER_RATE_LIMIT_PER_HOUR: '1000'
      FEED_RATE_LIMIT_PER_MINUTE: '6000'
      TAGGING_MODE: ${TAGGING_MODE:-user}
      TAGGING_SERVER_TAGS: ${TAGGING_SERVER_TAGS:-}
      # The types of post the server takes: all of them unless one is set to false.
      POST_TYPE_TEXT: ${POST_TYPE_TEXT:-true}
      POST_TYPE_IMAGE: ${POST_TYPE_IMAGE:-true}
      POST_TYPE_VIDEO: ${POST_TYPE_VIDEO:-true}
      POST_TYPE_AUDIO: ${POST_TYPE_AUDIO:-true}
      POST_TYPE_LINK: ${POST_TYPE_LINK:-true}
      # Videos are processed with the image's ffmpeg before they are published: made an MP4 that plays anywhere,
      # without their metadata, with a poster and an adaptive stream. false stores and serves them as they are sent.
      VIDEO_PROCESSING: ${VIDEO_PROCESSING:-true}
      # Reposts (POST /repost), and reposts of posts on other servers: both on unless set to false.
      REPOSTS: ${REPOSTS:-true}
      REPOSTS_REMOTE: ${REPOSTS_REMOTE:-true}
      # The keys the server signs its posts with for reposts on other servers (`openssl rand -base64 32`).
      # None unless set: its posts are then reposted only here.
      REPOSTS_SIGNING_KEYS: ${REPOSTS_SIGNING_KEYS:-}
      # The modification disclosure, which GET /rules gives beside the rules: true if this instance runs a
      # modified version of Evieverse, which then needs the address its source code can be obtained from.
      EVIEVERSE_MODIFIED: ${EVIEVERSE_MODIFIED:-false}
      EVIEVERSE_SOURCE_URL: ${EVIEVERSE_SOURCE_URL:-}
      # The email address people write to for support, which GET /rules gives beside the rules.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-noreply@yoururl.com}
      # The youngest a person may be to use the server, in years, which GET /rules gives beside the rules.
      # None unless set: GET /rules then says "All Legal Ages Allowed".
      MINIMUM_AGE: ${MINIMUM_AGE:-}
      # What the server says of content made with generative AI, which GET /rules gives beside the rules:
      # disclosure_optional (allowed), disclosure_required (allowed if it says so) or not_allowed.
      GEN_AI: ${GEN_AI:-disclosure_optional}
      # Ads in hashtag feeds and at the end of posts, which admins keep at /monetization/ads. Off unless set to true.
      MONETIZATION_FEED_ADS: ${MONETIZATION_FEED_ADS:-false}
      MONETIZATION_POST_ADS: ${MONETIZATION_POST_ADS:-false}
      # The optional trust plugins the server runs, by name. TRUST_OPTIONAL_PLUGINS=urlhaus refuses posts
      # and comments with a link on URLhaus's list of malware URLs, and then needs the Auth-Key of an
      # abuse.ch account, which is free (https://auth.abuse.ch). Off unless set.
      TRUST_OPTIONAL_PLUGINS: ${TRUST_OPTIONAL_PLUGINS:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      # TRUST_OPTIONAL_PLUGINS=pdq refuses posts and comments with an image whose PDQ hash is on a list of
      # hashes of known child sexual abuse material, and tells the admins. It then needs the list, which the
      # operator gets (see .env.example): an http(s) address, or the path of a file mounted into the container.
      PDQ_HASH_LIST: ${PDQ_HASH_LIST:-}
      PDQ_HASH_LIST_AUTHORIZATION: ${PDQ_HASH_LIST_AUTHORIZATION:-}
      # Where the files that matched are kept for the report and after it (see .env.example): a store of its
      # own, such as QUARANTINE_SCHEME=fs with QUARANTINE_OPTIONS={"root":"/app/data/quarantine"}. Unset: nothing
      # of a file that matches is kept.
      QUARANTINE_SCHEME: ${QUARANTINE_SCHEME:-}
      QUARANTINE_OPTIONS: ${QUARANTINE_OPTIONS:-}
      QUARANTINE_RETENTION_DAYS: ${QUARANTINE_RETENTION_DAYS:-365}
    volumes: [data:/app/data]

volumes:
  data:
