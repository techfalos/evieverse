# Just the API server, for building a frontend against: the app built from this repo, on Postgres and
# Valkey, with no seed data and no testbed page. Content and summaries are on a local volume, so
# /content/:id/raw streams bytes from the server itself rather than redirecting to an object store.
#
#   docker compose -f docker-compose.server.yml up -d --build
#   curl http://localhost:3000/health
#
# To start over: docker compose -f docker-compose.server.yml down -v
#
# The services shared with the other compose files are defined in compose.base.yml.
name: evieverse-server

services:
  postgres:
    extends: { file: compose.base.yml, service: postgres }
    ports: ['${SERVER_POSTGRES_PORT:-25432}:5432']
    volumes: [postgres:/var/lib/postgresql/data]

  redis:
    extends: { file: compose.base.yml, service: redis }
    ports: ['${SERVER_REDIS_PORT:-26379}:6379']
    volumes: [redis:/data]

  app:
    extends: { file: compose.base.yml, service: app }
    image: evieverse-server-app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ['${SERVER_PORT:-3000}:3000']
    environment:
      CONTENT_SCHEME: fs
      CONTENT_OPTIONS: '{"root":"/app/data/content"}'
      PUBLIC_BASE_URL: http://localhost:${SERVER_PORT:-3000}
      # Set to the frontend's origins, e.g. http://localhost:5173, to allow only those.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Docker Desktop gives every request from the host the same source IP, so the per-IP limit on
      # /register is effectively global.
      REGISTER_RATE_LIMIT_PER_HOUR: '1000'
      TAGGING_MODE: ${TAGGING_MODE:-user}
      TAGGING_SERVER_TAGS: ${TAGGING_SERVER_TAGS:-}
    volumes: [content:/app/data]

volumes:
  postgres:
  redis:
  content:
