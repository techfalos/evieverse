# A self-contained testbed: the API and compactor built from this repo, on Postgres, Valkey and an
# S3-compatible object store (RustFS), seeded with users, posts and likes spread over the last 45 days.
#
#   docker compose -f testbed/docker-compose.yml up -d --build
#   open http://localhost:8080                         # User and Latest feeds, and a posting form
#   curl 'http://localhost:8080/api/feed?tags=news,ai&hours=24'
#
# The page and the API share one origin: nginx serves the page and proxies /api to the app, and /s3 to
# the object store for presigned media links. The seed runs once, before the app starts; to start over:
#   docker compose -f testbed/docker-compose.yml down -v
#
# The services shared with the other compose files are defined in ../compose.base.yml.
name: evieverse-testbed

x-app-env: &app-env
  PUBLIC_BASE_URL: http://localhost:${TESTBED_PORT:-8080}/api
  COMPACT_IN_PROCESS: 'false'
  COMPACT_INTERVAL_SECONDS: ${COMPACT_INTERVAL_SECONDS:-5}
  # Every request reaches the app from nginx, so the per-IP limit on /register is effectively global.
  REGISTER_RATE_LIMIT_PER_HOUR: '1000'
  # user or server; server needs TAGGING_SERVER_TAGS too. The seed always sends its planned hashtags.
  TAGGING_MODE: ${TAGGING_MODE:-user}
  TAGGING_SERVER_TAGS: ${TAGGING_SERVER_TAGS:-}

services:
  postgres:
    extends: { file: ../compose.base.yml, service: postgres }
    ports: ['${TESTBED_POSTGRES_PORT:-15432}:5432']
    volumes: [postgres:/var/lib/postgresql/data]

  redis:
    extends: { file: ../compose.base.yml, service: redis }
    ports: ['${TESTBED_REDIS_PORT:-16379}:6379']
    volumes: [redis:/data]

  # Its console is at http://localhost:19001 (evieverse / evieverse-secret).
  s3:
    extends: { file: ../compose.base.yml, service: s3 }
    ports: ['${TESTBED_S3_CONSOLE_PORT:-19001}:9001']
    volumes: [s3:/data]

  s3-init:
    extends: { file: ../compose.base.yml, service: s3-init }
    depends_on: [s3]

  # Registers users and stores posts and likes through the app's own routes, on a clock set back in time,
  # then rebuilds the feed index. Skips itself once the database has users.
  seed:
    extends: { file: ../compose.base.yml, service: app-s3 }
    build:
      context: ..
      dockerfile: testbed/seed/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    environment:
      <<: *app-env
      SEED_POSTS: ${SEED_POSTS:-2400}
      SEED_READERS: ${SEED_READERS:-220}
      SEED_DAYS: ${SEED_DAYS:-45}
    healthcheck:
      disable: true
    volumes: [seed:/out]

  app:
    extends: { file: ../compose.base.yml, service: app-s3 }
    image: evieverse-testbed-app
    depends_on:
      seed: { condition: service_completed_successfully }
    environment: *app-env

  compactor:
    extends: { file: ../compose.base.yml, service: compactor }
    image: evieverse-testbed-app
    depends_on:
      seed: { condition: service_completed_successfully }
    environment: *app-env

  web:
    image: nginx:1.27-alpine
    depends_on:
      app: { condition: service_healthy }
    ports: ['${TESTBED_PORT:-8080}:80']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - seed:/srv/seed:ro

volumes:
  postgres:
  redis:
  s3:
  seed:
