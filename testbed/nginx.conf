server {
  listen 80;
  server_name _;
  client_max_body_size 1g;
  # Keep rewritten redirects relative: nginx would otherwise add its own port (80), not the published one.
  absolute_redirect off;

  # Docker's DNS, re-resolved so a restarted app or object store is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://app:3000;
  set $s3 http://s3:9000;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Cache-Control no-cache;
  }

  # Credentials of the seeded users, written by the seed container.
  location /seed/ {
    alias /srv/seed/;
    add_header Cache-Control no-store;
  }

  # The API, on the page's own origin. /content/:id/raw redirects to a presigned URL on s3:9000,
  # which the browser can't resolve, so the redirect is rewritten to go through /s3/ below.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_redirect http://s3:9000/ /s3/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Presigned URLs are signed for the host s3:9000, so they must arrive with that Host header.
  location /s3/ {
    rewrite ^/s3/(.*)$ /$1 break;
    proxy_pass $s3;
    proxy_set_header Host s3:9000;
    proxy_http_version 1.1;
    proxy_buffering off;
  }
}
